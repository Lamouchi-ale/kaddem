global:
  scrape_interval: 15s  # Scrape every 15 seconds

scrape_configs:
  - job_name: 'springbootapp'
    static_configs:
      - targets: ['172.18.0.5:8083']
    metrics_path: '/kaddem/actuator/prometheus'

  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['192.168.33.10:8080']
