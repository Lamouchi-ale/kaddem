version: '3.8'
services:
  app:
    build: .
    image: kaddem:latest
    container_name: spring_boot_app
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/kaddem?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SERVER_PORT: 8083
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db  # Nom du service dans Docker Compose
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem


    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
